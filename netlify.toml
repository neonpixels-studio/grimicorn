[build]
  command = "npm run test:ci && npm run build"
  publish = ".vitepress/dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    # script-src keeps 'unsafe-inline' because VitePress emits inline bootstrap scripts
    # (dark-mode/mac-os detection, __VP_SITE_DATA__) plus the inline JSON-LD. A static
    # netlify.toml cannot carry the per-build 'sha256-...' hashes those would need;
    # @todo drop 'unsafe-inline' by generating a _headers file with computed hashes at
    # build time. Until then, XSS hardening rests on object-src/base-uri/frame-ancestors.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"

# Self-hosted fonts are immutable: their content never changes under a given URL
# (a real change bumps the ?v= query in fonts.css), so serve them with a one-year
# cache to match the CDN caching Google Fonts previously provided. Without this,
# Netlify's static default (must-revalidate) revalidates every font per navigation.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
