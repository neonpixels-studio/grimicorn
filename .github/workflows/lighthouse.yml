name: Lighthouse

# Standalone perf/a11y/SEO budget gate, separate from ci.yml (which owns
# lint/typecheck/test/build) so this can iterate on thresholds independently.
# Runs Lighthouse CI against the real production build, served via the same
# .vitepress/e2e/serve-dist.mjs the Playwright smoke test uses, so the audit
# sees the real generated Content-Security-Policy and a regression in the
# hand-built LCP pipeline (hero preload, avif-first srcset, self-hosted fonts)
# fails here instead of shipping silently. Note: serve-dist.mjs applies only
# the generated CSP, not netlify.toml's static headers (Cache-Control,
# X-Frame-Options, HSTS, etc.) or Netlify's gzip/brotli compression — this gate
# cannot catch a regression in those, and resource-size budgets in
# lighthouserc.json are measured against uncompressed bytes (a real Netlify
# response is smaller). See lighthouserc.json for budgets.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read .nvmrc
        id: nvmrc
        run: echo "version=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nvmrc.outputs.version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Third-party action, pinned to a commit SHA (not just a version tag) per
      # least-privilege/supply-chain practice for non-GitHub-owned actions; the
      # first-party actions/* steps above follow the repo's existing major-tag
      # convention instead. Tag: 12.6.2.
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
