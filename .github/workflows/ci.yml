name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Fails loudly when GitHub has paused the weekly security.yml schedule for
  # inactivity (state "disabled_inactivity"); re-enable it from the Actions tab.
  schedule-health:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read

    steps:
      - name: Verify the security workflow schedule is active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/${{ github.repository }}/actions/workflows/security.yml" --jq .state)
          echo "security.yml state: ${state}"
          if [ "${state}" != "active" ]; then
            echo "::error title=Security schedule paused::security.yml is '${state}', so the weekly scan is not running. Re-enable it in the Actions tab."
            exit 1
          fi

  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history (not just the PR tip) so origin/<base branch> is available
          # locally for the asset-version bump check below, which diffs against it.
          fetch-depth: 0

      - name: Setup Node project
        uses: ./.github/actions/setup-node-project

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Check asset-version token bump against base branch
        run: npm run check:asset-version-bump

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node project
        uses: ./.github/actions/setup-node-project

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser smoke test
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
