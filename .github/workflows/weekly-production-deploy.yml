name: Weekly production deploy

# The cron is the single place the deploy cadence lives (Mondays 14:00 UTC).
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  deploy:
    # The hook always builds main, so a run dispatched from another branch must not deploy.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Covers the Netlify build (lint, typecheck, tests, build) polled by the verify step.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the 7-day commit check below sees every recent commit.
          fetch-depth: 0

      - name: Skip when main has no recent commits
        id: recent
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          recent_commit="$(git log --since='7 days ago' -1 --format=%H origin/main)"
          if [ -n "$recent_commit" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "main has no commits in the last 7 days; skipping the production deploy."
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Netlify production build hook
        id: trigger
        if: steps.recent.outputs.skip != 'true'
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK_URL" ]; then
            echo "::error::Repository secret NETLIFY_BUILD_HOOK_URL is not set; cannot trigger the production deploy."
            exit 1
          fi
          trigger_title="Manual+production+deploy"
          if [ "$EVENT_NAME" = "schedule" ]; then
            trigger_title="Weekly+production+deploy"
          fi
          hook_response="$(curl --fail --silent --show-error --max-time 30 -X POST -d '{}' "$NETLIFY_BUILD_HOOK_URL?trigger_title=$trigger_title")"
          # The hook answers with {"id": "<build id>"}; fail loudly if that shape changes.
          if ! build_id="$(echo "$hook_response" | jq -er '.id')"; then
            echo "::error::The build was queued but the hook response had no build id, so the deploy cannot be verified. Response: $hook_response"
            exit 1
          fi
          echo "Triggered Netlify production build ($trigger_title), build $build_id."
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      # A 2xx from the hook only means the build was queued; fail this run (and so
      # notify the owner) if the build fails, is cancelled, or never finishes.
      - name: Verify the Netlify production deploy
        if: steps.recent.outputs.skip != 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_BUILD_ID: ${{ steps.trigger.outputs.build_id }}
        run: node scripts/verify-netlify-deploy.mjs
